services:
  db:
    image: postgres:16-alpine
    container_name: rshb-db
    environment:
      POSTGRES_DB: rshb
      POSTGRES_USER: rshb
      POSTGRES_PASSWORD: rshb_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rshb -d rshb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rshb-api
    environment:
      DATABASE_URL: postgresql+psycopg2://rshb:rshb_secret@db:5432/rshb
      SECRET_KEY: change-me-in-production
    ports:
      - "8078:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
